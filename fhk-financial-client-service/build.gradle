plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

allprojects {
    group = 'com.fhk'
    version = 'v0.0.1'
    sourceCompatibility = '21'
    description = 'fhk-financial-client-service'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


subprojects { // setting.gradle에서 include된 모든 프로젝트에 공통적으로 적용할 설정
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'

    repositories {
        mavenCentral()
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {

        implementation files("${rootDir}/libs/fhk-common-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-core-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-security-core-1.0.0-plain.jar")

        implementation 'org.springframework.boot:spring-boot-starter-web'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'

        runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'org.springframework.boot:spring-boot-starter'

        implementation 'org.modelmapper:modelmapper:3.1.0'

        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

        annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
        implementation 'org.springframework.kafka:spring-kafka:3.3.3'


    }

    tasks.named('test') {
        useJUnitPlatform()
    }

}