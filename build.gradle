plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5' apply(false)
    id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

allprojects {
    group = 'com.fhk'
    version = 'v0.0.1'
    sourceCompatibility = '17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'java-test-fixtures'

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    ext {
        springCloudVersion = '2025.0.0'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
        }
    }

    dependencies {
        implementation files("${rootDir}/libs/fhk-common-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-core-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-security-core-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-api-metrics-client-1.0.0-plain.jar")
        implementation files("${rootDir}/libs/fhk-asset-storage-client-1.0.0-plain.jar")

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.modelmapper:modelmapper:3.1.0'
        annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

        runtimeOnly 'com.mysql:mysql-connector-j'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        implementation "org.springframework.boot:spring-boot-starter-data-redis"
      //  implementation 'org.springframework.cloud:spring-cloud-stream'
        implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'

        implementation "org.springframework.boot:spring-boot-starter-actuator"
      //  implementation "org.springframework.cloud:spring-cloud-starter-config"
      //  implementation "org.springframework.boot:spring-boot-starter-webflux"

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

        implementation platform("software.amazon.awssdk:bom:2.25.30")
        implementation 'software.amazon.awssdk:s3'
        implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    }

    test {
        useJUnitPlatform()
    }
}
